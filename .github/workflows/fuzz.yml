name: Fuzz Smoke Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang libspdlog-dev libfmt-dev libyaml-cpp-dev \
            libgtest-dev nlohmann-json3-dev libssl-dev libhiredis-dev
      - name: Configure
        run: CC=clang CXX=clang++ cmake -B build -DCMAKE_BUILD_TYPE=Debug -DLLMQUANT_ENABLE_FUZZING=ON -DLLMQUANT_WARNINGS_AS_ERRORS=OFF
      - name: Build
        run: cmake --build build -j$(nproc) --target fuzz_pipeline fuzz_deduplicator fuzz_token_stream fuzz_config fuzz_fix_parser
      - name: Smoke test (pipeline)
        run: ./build/fuzz_pipeline -runs=500 -max_total_time=30
      - name: Smoke test (deduplicator)
        run: ./build/fuzz_deduplicator -runs=500 -max_total_time=30
      - name: Smoke test (token stream)
        run: ./build/fuzz_token_stream -runs=500 -max_total_time=30
      - name: Smoke test (config YAML parser)
        run: ./build/fuzz_config -runs=500 -max_total_time=30
      - name: Smoke test (FIX protocol parser)
        run: ./build/fuzz_fix_parser -runs=500 -max_total_time=30

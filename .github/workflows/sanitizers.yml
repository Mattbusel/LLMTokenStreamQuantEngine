name: Sanitizers
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan-ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libspdlog-dev libfmt-dev libyaml-cpp-dev \
            libgtest-dev nlohmann-json3-dev \
            libssl-dev libhiredis-dev clang
      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLLMQUANT_ENABLE_ASAN=ON \
            -DLLMQUANT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --parallel $(nproc)

  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libspdlog-dev libfmt-dev libyaml-cpp-dev \
            libgtest-dev nlohmann-json3-dev \
            libssl-dev libhiredis-dev clang
      - name: Configure
        run: |
          cmake -B build-tsan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS_DEBUG="-g -O1 -fsanitize=thread -fno-omit-frame-pointer" \
            -DLLMQUANT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-tsan --parallel $(nproc)
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        # TSan tests must run serially: parallel execution triggers false-positive
        # race reports between independent test processes sharing TSan's shadow memory.
        run: ctest --test-dir build-tsan --output-on-failure --parallel 1

name: Sanitizers
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  asan-ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get install -y libspdlog-dev libyaml-cpp-dev libgtest-dev cmake nlohmann-json3-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DLLMQUANT_ENABLE_ASAN=ON -DLLMQUANT_WARNINGS_AS_ERRORS=OFF
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Test
        run: cd build && ctest --output-on-failure

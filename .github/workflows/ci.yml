name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y libspdlog-dev libfmt-dev libyaml-cpp-dev libgtest-dev nlohmann-json3-dev libssl-dev libhiredis-dev
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release

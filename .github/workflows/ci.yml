name: CI
on: [push, pull_request]

# Cancel in-progress runs for the same branch/PR when a new commit is pushed.
# This prevents stale CI runs from consuming minutes and blocking merges.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Release, Debug]
    env:
      CC:  ${{ matrix.compiler == 'clang' && 'clang'   || 'gcc'   }}
      CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++'   }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libspdlog-dev libfmt-dev libyaml-cpp-dev \
            libgtest-dev nlohmann-json3-dev \
            libssl-dev libhiredis-dev \
            clang clang-tidy cppcheck

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DLLMQUANT_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel $(nproc)

      - name: cppcheck (static analysis)
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Release'
        run: |
          cppcheck --error-exitcode=1 \
            --enable=warning,performance,portability \
            --suppress=missingIncludeSystem \
            -I include \
            src/*.cpp

      - name: clang-tidy (static analysis)
        if: matrix.compiler == 'clang' && matrix.build_type == 'Release'
        run: |
          cmake -B build-tidy \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLLMQUANT_ENABLE_CLANG_TIDY=ON \
            -DLLMQUANT_WARNINGS_AS_ERRORS=OFF
          cmake --build build-tidy --parallel $(nproc) 2>&1 | tee clang-tidy-output.txt
          ! grep -q "error:" clang-tidy-output.txt

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update -qq && sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          clang-format --dry-run --Werror \
            src/*.cpp include/*.h \
            tests/unit/*.cpp tests/integration/*.cpp tests/performance/*.cpp

  minimal:
    name: Minimal build (all optional features OFF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies

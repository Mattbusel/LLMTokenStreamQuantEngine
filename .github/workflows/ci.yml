name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Release, Debug]
    env:
      CC:  ${{ matrix.compiler == 'clang' && 'clang'   || 'gcc'   }}
      CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++'   }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libspdlog-dev libfmt-dev libyaml-cpp-dev \
            libgtest-dev nlohmann-json3-dev \
            libssl-dev libhiredis-dev \
            clang clang-tidy cppcheck

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DLLMQUANT_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel $(nproc)

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libspdlog-dev libfmt-dev libyaml-cpp-dev \
            libgtest-dev nlohmann-json3-dev \
            libssl-dev libhiredis-dev \
            clang clang-tidy
      - name: Configure (ASan + UBSan)
        run: |
          cmake -B build-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLLMQUANT_ENABLE_ASAN=ON \
            -DLLMQUANT_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build-asan --parallel $(nproc)
      - name: Test under ASan/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-asan --output-on-failure --parallel $(nproc)

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update -qq && sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          clang-format --dry-run --Werror \
            src/*.cpp include/*.h

  minimal:
    name: Minimal build (all optional features OFF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libspdlog-dev libfmt-dev libyaml-cpp-dev \
            libgtest-dev nlohmann-json3-dev
      - name: Configure (all optional features disabled)
        run: |
          cmake -B build-minimal \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLMQUANT_WARNINGS_AS_ERRORS=ON \
            -DLLMQUANT_ENABLE_PROMETHEUS=OFF \
            -DLLMQUANT_ENABLE_FIX_OMS=OFF \
            -DLLMQUANT_ENABLE_REST_OMS=OFF \
            -DLLMQUANT_ENABLE_DEDUP=OFF \
            -DLLMQUANT_ENABLE_PROFILING=OFF \
            -DLLMQUANT_ENABLE_JSON_STATS_SUMMARY=OFF
      - name: Build
        run: cmake --build build-minimal --parallel $(nproc)
      - name: Test
        run: ctest --test-dir build-minimal --output-on-failure --parallel $(nproc)

  feature-flags-matrix:
    name: Feature flag ${{ matrix.flag }}=OFF
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flag: LLMQUANT_ENABLE_PROMETHEUS
          - flag: LLMQUANT_ENABLE_FIX_OMS
          - flag: LLMQUANT_ENABLE_REST_OMS
          - flag: LLMQUANT_ENABLE_DEDUP
          - flag: LLMQUANT_ENABLE_PROFILING
          - flag: LLMQUANT_ENABLE_JSON_STATS_SUMMARY
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libspdlog-dev libfmt-dev libyaml-cpp-dev \
            libgtest-dev nlohmann-json3-dev \
            libssl-dev libhiredis-dev
      - name: Configure (${{ matrix.flag }}=OFF)
        run: |
          cmake -B build-flag \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLMQUANT_WARNINGS_AS_ERRORS=ON \
            -D${{ matrix.flag }}=OFF
      - name: Build
        run: cmake --build build-flag --parallel $(nproc)
      - name: Test
        run: ctest --test-dir build-flag --output-on-failure --parallel $(nproc)

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y doxygen graphviz \
            libspdlog-dev libfmt-dev libyaml-cpp-dev \
            libgtest-dev nlohmann-json3-dev libssl-dev libhiredis-dev
      - name: Configure (to generate llmquant_version.h)
        run: |
          cmake -B build-docs \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLMQUANT_WARNINGS_AS_ERRORS=OFF
      - name: Generate Doxygen docs
        run: doxygen docs/Doxyfile

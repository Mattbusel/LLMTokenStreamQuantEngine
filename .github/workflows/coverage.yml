name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libspdlog-dev libfmt-dev libyaml-cpp-dev \
            libgtest-dev nlohmann-json3-dev \
            libssl-dev libhiredis-dev \
            gcc g++ lcov

      - name: Configure (coverage build)
        # Explicitly use GCC so that lcov can find .gcno/.gcda files via gcov.
        # Clang emits compatible coverage data but requires llvm-cov as the gcov
        # tool; sticking to gcc avoids the extra toolchain dependency here.
        run: |
          CC=gcc CXX=g++ cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLLMQUANT_ENABLE_COVERAGE=ON \
            -DLLMQUANT_WARNINGS_AS_ERRORS=OFF

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --parallel $(nproc)

      - name: Collect coverage
        run: |
          lcov --capture \
               --directory build \
               --output-file coverage.info \
               --no-external \
               --rc branch_coverage=1 \
               --ignore-errors mismatch
          lcov --remove coverage.info \
               '*/tests/*' '*/gtest*' \
               --output-file coverage_filtered.info \
               --rc branch_coverage=1
          lcov --summary coverage_filtered.info --rc branch_coverage=1

      - name: Generate HTML report
        run: |
          genhtml coverage_filtered.info \
            --output-directory coverage_html \
            --branch-coverage \
            --legend \
            --title "LLMTokenStreamQuantEngine coverage"

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage_html/
          retention-days: 14

      - name: Upload lcov data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage_filtered.info
          retention-days: 14
